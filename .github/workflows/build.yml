name: D-Hub bauen und veroeffentlichen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [dhub.py, logo.png, logo.ico, installer.iss, AGB.txt, overlay/dhub_overlay.cpp]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version lesen und Repository eintragen
        id: ver
        shell: pwsh
        run: |
          $src = Get-Content dhub.py -Raw
          $v = [regex]::Match($src, '(?m)^VERSION = "(.+)"').Groups[1].Value
          $src = $src.Replace('DEFAULT_REPO = ""', 'DEFAULT_REPO = "' + $env:GITHUB_REPOSITORY + '"')
          [System.IO.File]::WriteAllText("$PWD/dhub.py", $src, (New-Object System.Text.UTF8Encoding($false)))
          "v=$v" >> $env:GITHUB_OUTPUT
      - run: pip install pyinstaller pywebview
      - uses: ilammy/msvc-dev-cmd@v1
        continue-on-error: true
      - name: Overlay-Bibliothek bauen (optional, ein Fehler hier stoppt den Build nicht)
        continue-on-error: true
        shell: cmd
        run: cl /nologo /LD /O2 /EHsc /std:c++17 /utf-8 overlay\dhub_overlay.cpp /Fe:dhub_overlay.dll /link user32.lib gdi32.lib
      - name: D-Hub.exe bauen
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path dhub_overlay.dll) { $extra += "--add-binary", "dhub_overlay.dll;." } else { Write-Host "Overlay-Bibliothek fehlt, Build laeuft ohne sie" }
          pyinstaller --onefile --noconsole --name D-Hub --icon logo.ico --add-data "logo.png;." --collect-all webview --hidden-import clr @extra dhub.py
      - name: Installer bauen
        shell: pwsh
        env:
          DHUB_VERSION: ${{ steps.ver.outputs.v }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: D-Hub ${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            output/D-Hub-Setup.exe
            dist/D-Hub.exe
            dhub.py
